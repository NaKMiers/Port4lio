name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Pinned to the `engines` range in package.json (>=22 <23), not `lts/*`:
      # a Node major bump should be a deliberate edit here, not something CI
      # picks up on its own the week Node 24 goes LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun, not npm, because bun.lock is the lockfile this project actually
      # maintains. Installing with a different tool than you develop with means
      # CI can only ever be as trustworthy as the staler of two lockfiles.
      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile: fail rather than silently resolve a new version if
      # bun.lock and package.json disagree. In CI, an install that "fixes" the
      # lockfile is a test running against dependencies nobody reviewed.
      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit + API only. Playwright is deliberately not run here: it needs a
      # browser install and a booted dev server, and `tests/e2e` is empty. Add
      # a second job when there is an E2E suite worth the ~2 minutes.
      #
      # `test:api` carries `--passWithNoTests`. `tests/api/` does not exist yet, and
      # without the flag vitest exits 1 on an empty match - which made this step fail
      # every run while `test:unit` passed, so the job was red for a reason that had
      # nothing to do with the code. The step stays in place so API tests run
      # automatically the day someone adds the first one.
      - name: Unit and API tests
        run: npm run test:unit && npm run test:api
